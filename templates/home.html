<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinanFlow | Gestão Financeira Inteligente</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-slate-950 via-slate-900 to-indigo-950 text-slate-100 font-sans min-h-screen flex flex-col justify-between p-6">
    
    <!-- Navbar / Nome do Site -->
    <header class="max-w-6xl w-full mx-auto flex justify-between items-center py-4 border-b border-slate-800/80">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center font-bold text-white shadow-lg shadow-indigo-500/30">F</div>
            <span class="text-xl font-bold tracking-wide text-white">Finan<span class="text-indigo-400">Flow</span></span>
        </div>
        <a href="/dashboard" class="text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-slate-200 px-4 py-2 rounded-lg border border-slate-700 transition">Acessar Painel</a>
    </header>

    <!-- Apresentação Principal -->
    <main class="max-w-4xl mx-auto text-center space-y-8 my-auto py-12">
        <span class="px-3 py-1 text-xs font-medium bg-indigo-500/10 text-indigo-400 rounded-full border border-indigo-500/20">
            Controle Pessoal Simplificado
        </span>
        <h1 class="text-4xl md:text-6xl font-extrabold tracking-tight text-white leading-tight">
            Gerencie suas finanças com facilidade e clareza.
        </h1>
        <p class="text-slate-400 text-base md:text-lg max-w-2xl mx-auto">
            Acompanhe receitas, organize despesas e mantenha o seu saldo sob controle com um painel dinâmico e moderno.
        </p>
        <div class="pt-4">
            <a href="/dashboard" class="inline-flex items-center gap-2 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-base px-8 py-3.5 rounded-xl shadow-lg shadow-indigo-600/30 hover:scale-105 transition transform">
                Acessar Gerenciador de Gastos
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6"></path></svg>
            </a>
        </div>
    </main>

    <!-- Rodapé -->
    <footer class="text-center text-xs text-slate-500 py-4">
        © FinanFlow — Sistema de Controle Financeiro
    </footer>

</body>
</html>
