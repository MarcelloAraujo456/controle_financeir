<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - FinanFlow</title>
    
    <!-- Configuração PWA -->
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <meta name="theme-color" content="#0f172a">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='icon-192.png') }}">

    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register("{{ url_for('static', filename='sw.js') }}");
      }
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4 font-sans">

    <div class="bg-slate-900 p-8 rounded-3xl border border-slate-800 shadow-xl w-full max-w-md">
        
        <div class="text-center mb-6">
            <div class="bg-indigo-600 text-white w-12 h-12 rounded-2xl flex items-center justify-center mx-auto text-2xl mb-2 font-bold shadow-lg shadow-indigo-500/30">
                F
            </div>
            <h1 class="text-2xl font-bold text-white" id="titulo-tela">Entrar na sua conta</h1>
            <p class="text-xs text-slate-400 mt-1" id="subtitulo-tela">Gerencie suas finanças de forma privativa e segura</p>
        </div>

        <!-- MENSAGEM DE ERRO -->
        <div id="msg-erro" class="hidden mb-4 p-3 bg-rose-500/10 border border-rose-500/20 text-rose-400 text-xs rounded-xl font-medium text-center"></div>

        <!-- FORMULÁRIO DE LOGIN E CADASTRO -->
        <form id="form-login" class="space-y-4">
            <div id="campo-nome" class="hidden">
                <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Seu Nome</label>
                <input type="text" id="login-nome" placeholder="Seu nome completo" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-indigo-500">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">E-mail</label>
                <input type="email" id="login-email" required placeholder="seu@email.com" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-indigo-500">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Senha</label>
                <input type="password" id="login-senha" required placeholder="••••••••" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-indigo-500">
            </div>

            <button type="submit" id="btn-submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 rounded-xl transition shadow-lg shadow-indigo-600/20 text-sm">
                Entrar
            </button>
        </form>

        <div class="mt-6 text-center space-y-2">
            <button id="btn-alternar" type="button" onclick="alternarModo()" class="text-xs text-indigo-400 font-semibold hover:underline block mx-auto">
                Não tem uma conta? Cadastre-se gratuitamente
            </button>
            <a href="/home" class="text-xs text-slate-400 hover:text-slate-200 block mx-auto">
                ← Voltar à página inicial
            </a>
        </div>

    </div>

    <script>
        let modoCadastro = false;

        function alternarModo() {
            modoCadastro = !modoCadastro;
            const campoNome = document.getElementById('campo-nome');
            const titulo = document.getElementById('titulo-tela');
            const subtitulo = document.getElementById('subtitulo-tela');
            const btnSubmit = document.getElementById('btn-submit');
            const btnAlternar = document.getElementById('btn-alternar');
            document.getElementById('msg-erro').classList.add('hidden');

            if (modoCadastro) {
                campoNome.classList.remove('hidden');
                titulo.innerText = "Criar nova conta";
                subtitulo.innerText = "Seus dados estarão totalmente protegidos e isolados";
                btnSubmit.innerText = "Criar Conta";
                btnAlternar.innerText = "Já tem uma conta? Clique para entrar";
            } else {
                campoNome.classList.add('hidden');
                titulo.innerText = "Entrar na sua conta";
                subtitulo.innerText = "Gerencie suas finanças de forma privativa e segura";
                btnSubmit.innerText = "Entrar";
                btnAlternar.innerText = "Não tem uma conta? Cadastre-se gratuitamente";
            }
        }

        document.getElementById('form-login').addEventListener('submit', async function(e) {
            e.preventDefault();
            const msgErro = document.getElementById('msg-erro');
            msgErro.classList.add('hidden');

            const email = document.getElementById('login-email').value;
            const senha = document.getElementById('login-senha').value;
            const nome = document.getElementById('login-nome').value;

            const endpoint = modoCadastro ? '/api/cadastro' : '/api/login';
            const payload = modoCadastro ? { nome, email, senha } : { email, senha };

            try {
                const res = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await res.json();

                if (res.ok) {
                    window.location.reload();
                } else {
                    msgErro.innerText = data.error || 'Ocorreu um erro. Tente novamente.';
                    msgErro.classList.remove('hidden');
                }
            } catch (err) {
                msgErro.innerText = 'Erro de conexão com o servidor.';
                msgErro.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
